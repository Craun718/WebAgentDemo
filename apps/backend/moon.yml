language: "typescript"
project:
  type: "application"
  platform: "node"

dependsOn:
  - shared

tasks:
  dev:
    command: "pnpm exec tsx watch src/index.ts"
  build:
    command: "pnpm exec tsdown"
    outputs:
      - "dist/**/*"
  typecheck:
    command: "pnpm exec tsc --noEmit"
  test:
    command: "pnpm exec vitest run"
    options:
      affectedFiles: true
