language: "typescript"
project:
  type: "application"
  platform: "node"

dependsOn:
  - shared

tasks:
  dev:
    command: "tsx watch src/index.ts"
  build:
    command: "tsup src/index.ts --format esm --dts --out-dir dist"
    outputs:
      - "dist/**/*"
  typecheck:
    command: "tsc --noEmit"
  test:
    command: "vitest run"
    options:
      affectedFiles: true
