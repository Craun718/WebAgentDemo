language: "typescript"
project:
  type: "application"
  platform: "browser"

dependsOn:
  - shared

tasks:
  dev:
    command: "pnpm exec vite"
  build:
    script: "pnpm exec vue-tsc --noEmit && pnpm exec vite build"
    outputs:
      - "dist/**/*"
  typecheck:
    command: "pnpm exec vue-tsc --noEmit"
  test:
    command: "pnpm exec vitest run"
    options:
      affectedFiles: true
  lint:
    command: "oxlint ."
    options:
      affectedFiles: true
