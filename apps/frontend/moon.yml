language: "typescript"
project:
  type: "application"
  platform: "browser"

dependsOn:
  - shared

tasks:
  dev:
    command: "vite"
  build:
    script: "vue-tsc --noEmit && vite build"
    outputs:
      - "dist/**/*"
  typecheck:
    command: "pnpm exec vue-tsc --noEmit"
  test:
    command: "vitest run"
    options:
      affectedFiles: true
  lint:
    command: "oxlint ."
    options:
      affectedFiles: true
